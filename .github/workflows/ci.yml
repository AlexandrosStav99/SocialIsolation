name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_MAPBOX_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit (all severities)
        run: npm run audit

      - name: Lint (zero warnings)
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Phase 1 privacy/data-boundary checks
        run: npm run test:boundaries

      - name: Phase 2 directory checks
        run: npm run test:directory

      - name: Phase 3 conversation checks
        run: npm run test:conversation

      - name: Phase 4 routing and safety checks
        run: npm run test:routing

      - name: Phase 5 AI boundary and fallback checks
        run: npm run test:ai

      - name: Phase 6 handoff and consent checks
        run: npm run test:handoff

      - name: Phase 7 RBAC and provider-workspace checks
        run: npm run test:rbac

      - name: Phase 8 privacy-safe analytics checks
        run: npm run test:analytics

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production regression tests
        run: npm test
