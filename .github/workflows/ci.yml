name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talkpoint
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: talkpoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talkpoint -d talkpoint"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://talkpoint:ci-only@127.0.0.1:5432/talkpoint
      PAYLOAD_SECRET: ci-only-not-for-deployment
      NEXT_PUBLIC_MAPBOX_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit (report upstream findings)
        run: npm run audit:full
        continue-on-error: true

      - name: Dependency security gate
        run: node scripts/check-dependency-security.mjs

      - name: Lint (zero warnings)
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Phase 1 privacy/data-boundary checks
        run: npm run test:boundaries

      - name: Phase 2 directory checks
        run: npm run test:directory

      - name: Phase 3 conversation checks
        run: npm run test:conversation

      - name: Phase 4 routing and safety checks
        run: npm run test:routing

      - name: Phase 5 AI boundary and fallback checks
        run: npm run test:ai

      - name: Phase 6 handoff and consent checks
        run: npm run test:handoff

      - name: Phase 7 RBAC and provider-workspace checks
        run: npm run test:rbac

      - name: Phase 8 privacy-safe analytics checks
        run: npm run test:analytics

      - name: Phase 9 UX, bilingual and accessibility checks
        run: npm run test:ux

      - name: Phase 10 verification and academic-evidence checks
        run: npm run test:verification

      - name: Payload PostgreSQL runtime checks
        run: npm run test:payload

      - name: Privacy-domain persistence checks
        run: npm run test:persistence

      - name: Provider RBAC and consent hardening checks
        run: npm run test:provider-consent

      - name: Generate initial Payload migration artifact
        env:
          NODE_ENV: development
          NODE_OPTIONS: --experimental-transform-types
        run: |
          timeout 120s npm run payload -- migrate:create initial_runtime_schema
          test -n "$(find migrations -maxdepth 1 -type f -name '*.ts' ! -name 'index.ts' -print -quit)"
          # Payload's generated migration imports type-only symbols as runtime ESM exports.
          # Normalize them before executing the migration under Node 24.
          for migration in migrations/*.ts; do
            [ "$(basename "$migration")" = "index.ts" ] && continue
            sed -i "s/import { MigrateUpArgs, MigrateDownArgs, sql } from '@payloadcms\/db-postgres'/import { sql } from '@payloadcms\/db-postgres'\\nimport type { MigrateUpArgs, MigrateDownArgs } from '@payloadcms\/db-postgres'/" "$migration"
          done
          echo "Generated migration files:"
          find migrations -maxdepth 1 -type f -print

      - name: Upload generated Payload migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: payload-initial-migration
          path: migrations/
          if-no-files-found: error

      - name: Verify generated migration on clean PostgreSQL
        run: |
          PGPASSWORD=ci-only psql -h 127.0.0.1 -U talkpoint -d postgres -c "DROP DATABASE talkpoint WITH (FORCE);"
          PGPASSWORD=ci-only psql -h 127.0.0.1 -U talkpoint -d postgres -c "CREATE DATABASE talkpoint OWNER talkpoint;"
          timeout 120s npm run payload -- migrate

      - name: Verify live PostgreSQL round trip after migration
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          timeout 120s npm run payload -- run scripts/check-postgres-integration.mjs

      - name: Build
        env:
          DATABASE_URL: postgresql://talkpoint:ci-only@127.0.0.1:5432/talkpoint
          PAYLOAD_SECRET: ci-only-not-for-deployment
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production regression tests
        run: npm test
