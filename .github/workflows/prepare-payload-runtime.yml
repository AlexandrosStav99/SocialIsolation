name: Prepare Payload runtime dependency lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: production/payload-postgres-runtime
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Payload PostgreSQL runtime
        run: npm install payload @payloadcms/next @payloadcms/db-postgres
      - name: Verify dependency graph
        run: npm audit --audit-level=low
      - name: Commit generated manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Install Payload PostgreSQL runtime dependencies"
          git push origin HEAD:production/payload-postgres-runtime
